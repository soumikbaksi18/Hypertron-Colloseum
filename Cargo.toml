[workspace]
resolver = "2"
members = [
    "programs/hypertron_pool",
    "prover",
    "prover-wasm",
]
# cargo-build-sbf (rustc 1.79) cannot parse enum-ordinalize 4.4+ (edition 2024).
# Keep Cargo.lock on enum-ordinalize 4.3.2 / enum-ordinalize-derive 4.3.2.
default-members = ["programs/hypertron_pool", "prover"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
